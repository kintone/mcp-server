name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Takumi Guard bot authentication (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{ !github.event.pull_request.head.repo.fork && secrets.TAKUMI_GUARD_BOT_ID || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mcpb
      - uses: actions/upload-artifact@v6.0.0
        with:
          path: build/kintone-mcp-server.mcpb
          name: kintone-mcp-server.mcpb
          retention-days: 3

  build-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Takumi Guard bot authentication (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{ !github.event.pull_request.head.repo.fork && secrets.TAKUMI_GUARD_BOT_ID || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack
      - uses: actions/upload-artifact@v6.0.0
        with:
          path: "kintone-mcp-server-*.tgz"
          name: kintone-mcp-server.tgz
          retention-days: 3
