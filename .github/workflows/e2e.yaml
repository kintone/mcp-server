name: e2e

on:
  push:
    branches:
      - main
      - "renovate/**"
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        runtime: [docker, npm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1.1.1
        with:
          bot-id: ${{ !github.event.pull_request.head.repo.fork && secrets.TAKUMI_GUARD_BOT_ID || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Docker runtime setup
      - name: Set up Docker Buildx
        if: matrix.runtime == 'docker'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        if: matrix.runtime == 'docker'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          tags: kintone-mcp-server:e2e
          load: true
        env:
          DOCKER_BUILD_SUMMARY: false

      # npm runtime setup
      - name: Install @kintone/mcp-server
        if: matrix.runtime == 'npm'
        run: |
          pnpm build
          pnpm add -g .

      # E2E test execution
      - name: Run E2E tests
        env:
          RUNTIME: ${{ matrix.runtime }}
          APP_ID: ${{ secrets.E2E_APP_ID }}
          KINTONE_BASE_URL: ${{ secrets.E2E_KINTONE_BASE_URL }}
          KINTONE_USERNAME: ${{ secrets.E2E_KINTONE_USERNAME }}
          KINTONE_PASSWORD: ${{ secrets.E2E_KINTONE_PASSWORD }}
        run: |
          pnpm test:e2e
